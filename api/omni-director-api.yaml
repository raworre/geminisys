openapi: 3.1.0
info:
  title: "Geminisys Omni-Director API"
  summary: "Omni Director API"
  description: "Core API for interactions with the Genesys Omni Director"
  contact:
    name: "Roger A. Worrell"
    url: "https://worksbyworrell.com"
    email: "raworre@gmail.com"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Local Game Server
security: []
paths:
  /campaigns:
    get:
      operationId: listCampaigns
      summary: List Campaigns
      description: Get a collection of available game campaigns/states
      responses:
        "200":
          description: Successfully fetched available campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /campaigns/{id}:
    get:
      operationId: getCampaignById
      summary: Get Campaign State
      description: Get the current state of a campaign by its ID. The frontend polls this endpoint to determine what UI to draw.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successfully fetched campaign state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Campaign not found

  /campaigns/{id}/characters/{characterId}:
    get:
      operationId: getCharacterById
      summary: Get Character State
      description: Get the current stats and details of a specific character within a campaign.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: characterId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successfully fetched character state
          content:
            application/json:
              schema:
                $ref: genesys.schema.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Character or Campaign not found

  /campaigns/{id}/intents:
    post:
      operationId: submitIntent
      summary: Submit Player Intent
      description: Submit a text-based action. If all participating players have submitted, the server auto-transitions the state to POOL_ASSIGNMENT.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerIntent"
      responses:
        "202":
          description: Intent successfully queued
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /campaigns/{id}/rolls:
    post:
      operationId: submitRoll
      summary: Submit Dice Roll
      description: Submit physical dice results. If all required rolls are submitted, the server auto-transitions the state to RESOLUTION.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerRoll"
      responses:
        "202":
          description: Roll successfully queued
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CampaignSummary:
      type: object
      properties:
        id:
          type: string
          description: "The unique slug for the campaign"
        _link:
          type: string
          description: "Hypermedia link to fetch the full campaign state"

    CharacterSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        _link:
          type: string
          description: "Hypermedia link to fetch the full character sheet"

    GameState:
      type: object
      properties:
        scene_status:
          type: string
          enum: [INTENT_COLLECTION, POOL_ASSIGNMENT, ROLL_COLLECTION, RESOLUTION]
          description: "The master state flag that drives the frontend UI mode."
        narrative_log:
          type: array
          items:
            type: string
          description: "The ongoing story text."
        pending_rolls:
          type: object
          additionalProperties:
            type: object
            properties:
              pool:
                type: array
                items:
                  type: string
              reason:
                type: string
          description: "A map of character names to their required dice pools. Used by the UI to trigger the Dice Tray."
        characters:
          type: array
          items:
            $ref: "#/components/schemas/CharacterSummary"

    PlayerIntent:
      type: object
      required: [character, action_text]
      properties:
        character:
          type: string
          example: "Warlock"
        action_text:
          type: string
          example: "I vault the table and shoot the bounty hunter."

    PlayerRoll:
      type: object
      required: [character, dice_result]
      properties:
        character:
          type: string
          example: "Warlock"
        dice_result:
          type: string
          example: "2 Success, 1 Threat"

    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        status:
          type: number
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
          format: uri
