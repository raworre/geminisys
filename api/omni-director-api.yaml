openapi: 3.1.0
info:
  title: "Geminisys Omni-Director API"
  summary: "Omni Director API"
  description: |
    Core API for interactions with the Genesys Omni Director.

    ### Application Error Codes
    When the API returns a `Problem` object (e.g., 400 or 404), the `type` field will contain a URI identifying the specific error. The frontend can use this to render precise error messages or retry states.

    | `type` URI | HTTP Status | Description |
    |---|---|---|
    | `urn:geminisys:error:campaign-not-found` | 404 | The requested campaign ID does not exist. |
    | `urn:geminisys:error:character-not-found` | 404 | The requested character ID is not in the campaign. |
    | `urn:geminisys:error:wrong-phase` | 400 | Tried to submit an intent or roll when the scene is not in the correct `scene_status`. |
    | `urn:geminisys:error:no-pending-pool` | 400 | Tried to submit a roll for a character that the GM did not request a roll for. |
    | `urn:geminisys:error:duplicate-submission` | 400 | This character has already staged an intent or roll for the current phase. |
    | `urn:geminisys:error:invalid-roll-syntax` | 400 | The `dice_result` string is malformed or uses unrecognized vocabulary. |
    | `urn:geminisys:error:llm-failure` | 500 | The backend failed to generate a response from the AI GM. |
  contact:
    name: "Roger A. Worrell"
    url: "https://worksbyworrell.com"
    email: "raworre@gmail.com"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 1.1.0
servers:
  - url: http://localhost:8000/api
    description: Local Game Server
security: []
paths:
  /campaigns:
    get:
      operationId: listCampaigns
      summary: List Campaigns
      description: Get a collection of available game campaigns/states
      responses:
        "200":
          description: Successfully fetched available campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /campaigns/{id}:
    get:
      operationId: getCampaignById
      summary: Get Campaign State
      description: Get the current state of a campaign by its ID. The frontend polls this endpoint to determine what UI to draw.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successfully fetched campaign state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /campaigns/{id}/characters/{characterId}:
    get:
      operationId: getCharacterById
      summary: Get Character State
      description: Get the current stats and details of a specific character within a campaign.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: characterId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successfully fetched character state
          content:
            application/json:
              schema:
                $ref: genesys.schema.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /campaigns/{id}/intents:
    post:
      operationId: submitIntent
      summary: Submit Player Intent
      description: Submit a text-based action. If all participating players have submitted, the server auto-transitions the state to POOL_ASSIGNMENT.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerIntent"
      responses:
        "202":
          description: Intent successfully queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /campaigns/{id}/rolls:
    post:
      operationId: submitRoll
      summary: Submit Dice Roll
      description: Submit physical dice results. If all required rolls are submitted, the server auto-transitions the state to RESOLUTION.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerRoll"
      responses:
        "202":
          description: Roll successfully queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource Not Found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalServerError:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        status:
          type: number
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
          format: uri

    Links:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string

    CampaignSummary:
      type: object
      required: [id, name, _links]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        _links:
          $ref: "#/components/schemas/Links"

    CharacterSummary:
      type: object
      required: [id, name, _links]
      properties:
        id:
          type: string
        name:
          type: string
        _links:
          $ref: "#/components/schemas/Links"

    NarrativeEntry:
      type: object
      required: [speaker, text]
      properties:
        speaker:
          type: string
          enum: [GM, SYSTEM, PLAYER]
        text:
          type: string
        timestamp:
          type: string
          format: date-time
        mechanics:
          type: array
          items:
            type: string

    GameState:
      type: object
      required: [scene_status, narrative_log, characters, staged_intents, staged_rolls]
      properties:
        scene_status:
          type: string
          enum: [INTENT_COLLECTION, POOL_ASSIGNMENT, ROLL_COLLECTION, RESOLUTION]
        narrative_log:
          type: array
          items:
            $ref: "#/components/schemas/NarrativeEntry"
        pending_rolls:
          type: object
          additionalProperties:
            type: object
            required: [pool]
            properties:
              pool:
                type: array
                items:
                  type: string
              reason:
                type: string
        characters:
          type: array
          items:
            $ref: "#/components/schemas/CharacterSummary"
        staged_intents:
          type: array
          items:
            $ref: "#/components/schemas/PlayerIntent"
        staged_rolls:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRoll"

    PlayerIntent:
      type: object
      required: [character_id, action_text]
      properties:
        character_id:
          type: string
        action_text:
          type: string
        mode:
          type: string
          enum: [ic, ooc]
          default: ic

    PlayerRoll:
      type: object
      required: [character_id, dice_result]
      properties:
        character_id:
          type: string
        dice_result:
          type: string

    ActionResponse:
      type: object
      required: [message, scene_status]
      properties:
        message:
          type: string
        scene_status:
          type: string
