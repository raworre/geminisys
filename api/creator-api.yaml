openapi: 3.1.0
info:
  title: "Geminisys Creator API"
  summary: "Campaign and Character Creator API"
  description: |
    API for the AI-Assisted Campaign and Character Creation pipeline.
    This API allows the frontend to facilitate a Socratic brainstorming session with the AI,
    and then command the backend to formally generate the underlying markdown and JSON files.

    ### Application Error Codes
    | `type` URI | HTTP Status | Description |
    |---|---|---|
    | `urn:geminisys:error:session-not-found` | 404 | The requested `session_id` does not exist or has expired. |
    | `urn:geminisys:error:campaign-not-found` | 404 | Tried to access a campaign that hasn't been generated yet. |
    | `urn:geminisys:error:draft-not-found` | 404 | Tried to crunch a character draft that hasn't been initialized. |
    | `urn:geminisys:error:insufficient-xp` | 400 | The player attempted to buy an upgrade but does not have enough XP. |
    | `urn:geminisys:error:invalid-upgrade` | 400 | The player attempted an illegal upgrade (e.g. increasing a characteristic past 6, or a skill past 5). |
    | `urn:geminisys:error:validation` | 400 | The request payload failed schema validation. |
  contact:
    name: "Roger A. Worrell"
    url: "https://worksbyworrell.com"
    email: "raworre@gmail.com"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Local Game Server
security: []
paths:
  /rules/skills:
    get:
      operationId: getSkills
      summary: Get Skills Reference Data
      description: Returns the static list of all Genesys skills.
      responses:
        "200":
          description: A list of skills.
          content:
            application/json:
              schema:
                type: array

  /rules/talents:
    get:
      operationId: getTalents
      summary: Get Talents Reference Data
      description: Returns the static list of all Genesys talents.
      responses:
        "200":
          description: A list of talents.
          content:
            application/json:
              schema:
                type: array

  /creator/campaign/chat:
    post:
      operationId: campaignChat
      summary: Send Campaign Brainstorm Message
      description: Sends a user message to the AI world-building assistant. Pass the returned `session_id` in subsequent requests to continue the conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: AI response received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /creator/campaign/finalize:
    post:
      operationId: campaignFinalize
      summary: Finalize Campaign Generation
      description: Tells the backend to take the current chat session and generate the final `campaign_setting.md` and `current_state.md` files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeCampaignRequest"
      responses:
        "200":
          description: Campaign successfully generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /creator/character/chat:
    post:
      operationId: characterChat
      summary: Send Character Brainstorm Message
      description: Sends a user message to the AI character creation assistant. Pass the returned `session_id` in subsequent requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: AI response received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /creator/character/save:
    post:
      operationId: characterSave
      summary: Save Draft Character
      description: Tells the backend to take the character chat session and generate the draft narrative profile. The UI will then load this JSON draft into memory for the Phase 3 Crunch phase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeCharacterRequest"
      responses:
        "200":
          description: Returns the raw JSON of the narrative profile.
          content:
            application/json:
              schema:
                type: object
                description: The draft narrative_profile JSON object.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /creator/character/finalize:
    post:
      operationId: characterFinalize
      summary: Finalize Completed Character Sheet
      description: After Phase 3 is complete, the frontend posts the finalized Character JSON here to be written to disk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCharacterRequest"
      responses:
        "200":
          description: Character successfully saved to disk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /creator/character/crunch/start:
    post:
      operationId: crunchStart
      summary: Initialize Character Draft for Crunch
      description: Takes the narrative profile and initializes a mechanical draft (e.g. 100 XP, all stats at 2) on the backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrunchStartRequest"
      responses:
        "200":
          description: Draft initialized and returned.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"

  /creator/character/crunch/{campaign_id}/{character_id}:
    get:
      operationId: crunchGet
      summary: Get Current Draft State
      description: Returns the current JSON sheet for the character draft in progress.
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
        - name: character_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The current draft sheet.
          content:
            application/json:
              schema:
                type: object

  /creator/character/crunch/buy:
    patch:
      operationId: crunchBuy
      summary: Purchase an Upgrade
      description: Attempts to purchase a mechanical upgrade (characteristic, skill, talent). Backend validates XP and prerequisites.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrunchActionRequest"
      responses:
        "200":
          description: Purchase successful, returns updated sheet.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Illegal purchase (e.g., insufficient XP).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /creator/character/crunch/refund:
    patch:
      operationId: crunchRefund
      summary: Refund an Upgrade
      description: Reverses a mechanical upgrade.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrunchActionRequest"
      responses:
        "200":
          description: Refund successful, returns updated sheet.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Illegal refund.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /creator/character/crunch/finish:
    post:
      operationId: crunchFinish
      summary: Finalize Character Crunch
      description: Moves the character out of the drafts folder and locks it into the campaign roster.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrunchStartRequest"
      responses:
        "200":
          description: Character locked in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource Not Found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        status:
          type: number
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
          format: uri

    ChatRequest:
      type: object
      required: [message]
      properties:
        session_id:
          type: string
          description: Omit on the first message to start a new chat. Include it thereafter.
        campaign_id:
          type: string
          description: Omit for Phase 1. Required for Phase 2, 3, and 4 so the backend can inject campaign lore/characters into the AI context.
        character_id:
          type: string
          description: Pass this during Phase 3 (Crunch) so the AI can load the player's draft character sheet and offer mechanical advice.
        message:
          type: string

    ChatResponse:
      type: object
      required: [session_id, response, is_complete]
      properties:
        session_id:
          type: string
          description: The active chat session ID.
        response:
          type: string
          description: The text response from the AI assistant.
        is_complete:
          type: boolean
          description: True if the AI believes it has enough information to finalize the generation.
        turn_number:
          type: integer
          description: The current turn number in the chat sequence (useful for logging and debugging delays).

    FinalizeCampaignRequest:
      type: object
      required: [session_id, campaign_id]
      properties:
        session_id:
          type: string
        campaign_id:
          type: string
          description: The unique slug for the new campaign (e.g. 'space-bounty')

    FinalizeCharacterRequest:
      type: object
      required: [session_id, campaign_id, character_id]
      properties:
        session_id:
          type: string
        campaign_id:
          type: string
          description: The campaign this character belongs to.
        character_id:
          type: string
          description: The unique slug for the character (e.g. 'warlock')

    SaveCharacterRequest:
      type: object
      required: [campaign_id, character_id, sheet]
      properties:
        campaign_id:
          type: string
        character_id:
          type: string
        sheet:
          type: object
          description: The complete GenesysCharacterSheet JSON object representing the finished character.

    CrunchStartRequest:
      type: object
      required: [campaign_id, character_id]
      properties:
        campaign_id:
          type: string
        character_id:
          type: string

    CrunchActionRequest:
      type: object
      required: [campaign_id, character_id, type, target]
      properties:
        campaign_id:
          type: string
        character_id:
          type: string
        type:
          type: string
          enum: [characteristic, skill, talent]
          description: The category of the upgrade.
        target:
          type: string
          description: The specific target to upgrade (e.g. 'brawn', 'computers', 'dodge').

    SuccessResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
        message:
          type: string
